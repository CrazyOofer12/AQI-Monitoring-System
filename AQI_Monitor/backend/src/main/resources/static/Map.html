<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQI Map View - Air Quality Monitor</title>

    <!-- Leaflet & Cluster CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">

    <style>
        :root {
            --bg-page: #f8fafc;
            --bg-sidebar: #ffffff;
            --border-color: #e2e8f0;
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            --primary-blue: #2563eb;
            --primary-light: #eff6ff;
            --shadow-card: 0 4px 20px -2px rgba(15, 23, 42, 0.08);
            --font-primary: 'Outfit', sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: var(--font-primary);
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background: var(--bg-page);
            color: var(--text-primary);
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            padding: 24px 20px;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-title {
            font-weight: 700;
            font-size: 1.15rem;
            color: var(--text-primary);
        }

        .brand-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
            font-weight: 500;
            text-transform: uppercase;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.9375rem;
            transition: all 0.2s ease;
        }

        .nav-item:hover {
            background: var(--primary-light);
            color: var(--primary-blue);
        }

        .nav-item.active {
            background: var(--primary-light);
            color: var(--primary-blue);
            font-weight: 600;
        }

        .sidebar-footer {
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
        }

        .user-card {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px;
            border-radius: 10px;
            background: #f8fafc;
            border: 1px solid var(--border-color);
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary-blue);
            color: white;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .user-name {
            font-size: 0.875rem;
            font-weight: 600;
        }

        .logout-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 10px;
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
        }

        /* Map Container */
        .main-map-content {
            flex: 1;
            position: relative;
            height: 100vh;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* Floating Legend Card */
        .legend-card {
            position: absolute;
            bottom: 24px;
            right: 24px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            padding: 16px 20px;
            border-radius: 14px;
            box-shadow: var(--shadow-card);
            z-index: 1000;
            font-size: 0.875rem;
        }

        .legend-title {
            font-weight: 700;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .legend-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
            color: var(--text-secondary);
        }

        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            display: inline-block;
        }
    </style>
</head>
<body>

<aside class="sidebar">
    <div class="brand">
        <svg width="34" height="34" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="18" fill="#2563eb" fill-opacity="0.12"/>
            <path d="M20 8C13.4 8 8 13.4 8 20C8 26.6 13.4 32 20 32C26.6 32 32 26.6 32 20C32 13.4 26.6 8 20 8ZM20 28C15.6 28 12 24.4 12 20C12 15.6 15.6 12 20 12C24.4 12 28 15.6 28 20C28 24.4 24.4 28 20 28Z" fill="#2563eb"/>
            <circle cx="20" cy="20" r="4" fill="#0284c7"/>
        </svg>
        <div style="display:flex; flex-direction:column;">
            <span class="brand-title">AQI Monitor</span>
            <span class="brand-sub">Live Map View</span>
        </div>
    </div>

    <nav class="nav-menu">
        <a href="dashboard.html" class="nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
                <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
                <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
                <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
            </svg>
            <span>Dashboard</span>
        </a>
        <a href="Map.html" class="nav-item active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="9"></circle>
                <line x1="3.6" y1="9" x2="20.4" y2="9"></line>
                <line x1="3.6" y1="15" x2="20.4" y2="15"></line>
                <path d="M11.5 3a17 17 0 0 0 0 18M12.5 3a17 17 0 0 1 0 18"></path>
            </svg>
            <span>Map View</span>
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="user-card">
            <div class="avatar" id="avatarInitial">U</div>
            <div class="user-info">
                <div class="user-name" id="username">User</div>
            </div>
        </div>

        <form action="/logout" method="post">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>
</aside>

<main class="main-map-content">
    <div id="map"></div>

    <div class="legend-card">
        <div class="legend-title">AQI Legend Scale</div>
        <div class="legend-row"><span class="legend-dot" style="background:#22c55e"></span> Good (0–50)</div>
        <div class="legend-row"><span class="legend-dot" style="background:#eab308"></span> Moderate (51–100)</div>
        <div class="legend-row"><span class="legend-dot" style="background:#f97316"></span> Poor (101–150)</div>
        <div class="legend-row"><span class="legend-dot" style="background:#ef4444"></span> Unhealthy (151–200)</div>
        <div class="legend-row"><span class="legend-dot" style="background:#a855f7"></span> Very Unhealthy (201–300)</div>
        <div class="legend-row"><span class="legend-dot" style="background:#991b1b"></span> Hazardous (301+)</div>
    </div>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script>
    // Indian Geographic Bounding Box (Southwest to Northeast)
    const southWest = L.latLng(6.0, 68.0);
    const northEast = L.latLng(37.5, 97.5);
    const indiaBounds = L.latLngBounds(southWest, northEast);

    // Initialize Map with strict bounds around India
    const map = L.map('map', {
        minZoom: 4,
        maxZoom: 13,
        maxBounds: indiaBounds,
        maxBoundsViscosity: 1.0
    }).setView([20.5937, 78.9629], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    let heatLayer;
    const markerCluster = L.markerClusterGroup({
        showCoverageOnHover: false,
        maxClusterRadius: 40
    });

    function getAQIColor(aqi) {
        if (aqi <= 50) return "#22c55e";
        if (aqi <= 100) return "#eab308";
        if (aqi <= 150) return "#f97316";
        if (aqi <= 200) return "#ef4444";
        if (aqi <= 300) return "#a855f7";
        return "#991b1b";
    }

    function getIntensity(aqi) {
        let normalized = aqi / 300;
        let boosted = Math.pow(normalized, 2);
        if (map.getZoom() > 8) boosted *= 0.7;
        return Math.max(0.1, Math.min(boosted, 1));
    }

    // Dynamic Heatmap radius and blur adjustment per zoom level
    function updateHeatmapStyle() {
        if (!heatLayer) return;
        const zoom = map.getZoom();
        let radius, blur;

        if (zoom <= 5) {
            radius = 50;
            blur = 40;
        } else if (zoom <= 7) {
            radius = 35;
            blur = 30;
        } else if (zoom <= 9) {
            radius = 25;
            blur = 20;
        } else if (zoom <= 11) {
            radius = 18;
            blur = 14;
        } else {
            radius = 12;
            blur = 8;
        }

        heatLayer.setOptions({
            radius: radius,
            blur: blur
        });
    }

    function renderMapData(aqiData) {
        const heatPoints = aqiData
            .filter(p => p.aqi && p.aqi > 0)
            .map(p => [p.lat, p.lon, getIntensity(p.aqi)]);

        if (!heatLayer) {
            heatLayer = L.heatLayer(heatPoints, {
                radius: 40,
                blur: 35,
                maxZoom: 10,
                minOpacity: 0.15,
                gradient: {
                    0.2: "rgba(34,197,94,0.3)",
                    0.4: "rgba(234,179,8,0.4)",
                    0.6: "rgba(249,115,22,0.6)",
                    0.8: "rgba(239,68,68,0.8)",
                    1.0: "rgba(153,27,27,0.95)"
                }
            });
        } else {
            heatLayer.setLatLngs(heatPoints);
        }

        updateHeatmapStyle();

        markerCluster.clearLayers();

        aqiData.forEach(place => {
            if (!place.aqi || place.aqi <= 0) return;

            const marker = L.circleMarker([place.lat, place.lon], {
                radius: 7,
                fillColor: getAQIColor(place.aqi),
                color: "#ffffff",
                weight: 1.5,
                fillOpacity: 0.85
            });

            marker.bindPopup(`
                <div style="font-family: 'Outfit', sans-serif; min-width: 180px; padding: 4px;">
                    <b style="font-size: 1rem; color: #0f172a;">${place.city}</b><br>
                    <span style="font-size: 0.8rem; color: #64748b;">Station: ${place.station || 'N/A'}</span><br>
                    <div style="margin-top: 6px; font-weight: 700; color: ${getAQIColor(place.aqi)}">
                        AQI Index: ${place.aqi}
                    </div>
                </div>
            `);

            markerCluster.addLayer(marker);
        });
    }

    function updateLayers() {
        const zoom = map.getZoom();
        if (zoom < 7) {
            if (!map.hasLayer(heatLayer) && heatLayer) map.addLayer(heatLayer);
            if (map.hasLayer(markerCluster)) map.removeLayer(markerCluster);
        } else {
            if (!map.hasLayer(markerCluster)) map.addLayer(markerCluster);
            if (map.hasLayer(heatLayer) && heatLayer) map.removeLayer(heatLayer);
        }
        updateHeatmapStyle();
    }

    map.on("zoomend", updateLayers);
    map.on("zoom", updateHeatmapStyle);

    async function loadAQIData() {
        try {
            const response = await fetch("/api/map");
            if (!response.ok) return;

            const data = await response.json();
            if (data && data.length > 0) {
                renderMapData(data);
                updateLayers();
            }
        } catch (error) {
            console.error("Error fetching map data:", error);
        }
    }

    function loadUser() {
        fetch("/auth/me")
            .then(res => res.json())
            .then(data => {
                const username = data.username || "User";
                document.getElementById("username").textContent = username;
                document.getElementById("avatarInitial").textContent = username.charAt(0).toUpperCase();
            })
            .catch(() => {});
    }

    document.addEventListener("DOMContentLoaded", () => {
        loadUser();
        loadAQIData();
        setTimeout(() => map.invalidateSize(), 200);
    });
</script>

</body>
</html>

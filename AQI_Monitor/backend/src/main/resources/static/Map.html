<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AQI Map View</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster/dist/MarkerCluster.Default.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
          rel="stylesheet">
    <link rel="stylesheet" href="map.css">
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">


    <style>
        body {
            margin: 0;
            font-family: var(--font-primary);
        }

        .header {
            padding: 15px;
            background: #111827;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
          text-align: center;
          padding: 15px;
          background: #1e293b;
          color: white;
        }
        .back-btn {
            background: #2563eb;
            border: none;
            padding: 8px 14px;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }

        #map {
            height: calc(100vh - 60px);
            width: 100%;
        }
        .legend {
          position: absolute;
          bottom: 20px;
          left: 290px;
          background: white;
          padding: 12px;
          border-radius: 10px;
          box-shadow: 0 4px 15px rgba(0,0,0,0.2);
          z-index: 1000;
          font-size: 14px;
          line-height: 1.8;
        }

        .legend div {
          display: flex;
          align-items: center;
          gap: 8px;
        }

        .legend span {
          display: inline-block;
          width: 16px;
          height: 16px;
          border-radius: 50%;
          border: 1px solid #333;
        }
        .leaflet-interactive {
            filter: blur(1.5px);
        }
        .leaflet-heatmap-layer {
            filter: blur(2px) contrast(1.1);
        }
        .leaflet-tile {
            filter: brightness(0.9) contrast(1.05);
        }
    </style>
</head>
<body>
<aside class="sidebar">
    <div class="logo">
        <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="20" cy="20" r="18" fill="url(#gradient)" opacity="0.2"/>
            <path d="M20 8C13.4 8 8 13.4 8 20C8 26.6 13.4 32 20 32C26.6 32 32 26.6 32 20C32 13.4 26.6 8 20 8ZM20 28C15.6 28 12 24.4 12 20C12 15.6 15.6 12 20 12C24.4 12 28 15.6 28 20C28 24.4 24.4 28 20 28Z"
                  fill="url(#gradient)"/>
            <circle cx="20" cy="20" r="4" fill="url(#gradient)"/>
            <defs>
                <linearGradient id="gradient" x1="0" y1="0" x2="40" y2="40">
                    <stop offset="0%" style="stop-color:#FF9933"/>
                    <stop offset="50%" style="stop-color:#138808"/>
                    <stop offset="100%" style="stop-color:#000080"/>
                </linearGradient>
            </defs>
        </svg>
        <span>AQI Monitor</span>
    </div>

    <nav class="nav-menu">
        <a href="dashboard.html" class="nav-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="7" height="7"></rect>
                <rect x="14" y="3" width="7" height="7"></rect>
                <rect x="14" y="14" width="7" height="7"></rect>
                <rect x="3" y="14" width="7" height="7"></rect>
            </svg>
            Dashboard
        </a>
        <a href="#" class="nav-item active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="2" y1="12" x2="22" y2="12"></line>
                <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
            Map View
        </a>
    </nav>

    <div class="sidebar-footer">
        <div class="user-profile">
            <div class="avatar">U</div>
            <div class="user-info">
                <div class="user-name" id="username"></div>
                <div class="user-role">Monitor</div>
            </div>
        </div>

        <!-- Logout Button -->
        <form action="/logout" method="post" class="logout-form">
            <button type="submit" class="logout-btn">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                Logout
            </button>
        </form>
    </div>
</aside>

<main class="main-content">
    <div class="legend">
        <div><span style="background:#00e400"></span> Good (0–50)</div>
        <div><span style="background:#ffff00"></span> Moderate (51–100)</div>
        <div><span style="background:#ff7e00"></span> Poor (101–150)</div>
        <div><span style="background:#ff0000"></span> Unhealthy (151–200)</div>
        <div><span style="background:#8f3f97"></span> Very Unhealthy (201–300)</div>
        <div><span style="background:#7e0023"></span> Hazardous (301+)</div>
    </div>
    <div id="map" style="height: 100vh; width: 100%;"></div>
</main>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
<script src="https://unpkg.com/leaflet.markercluster/dist/leaflet.markercluster.js"></script>

<script>
    // =======================
    // MAP INITIALIZATION
    // =======================

    const map = L.map('map').setView([20.5937, 78.9629], 5);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap'
    }).addTo(map);

    // =======================
    // GLOBAL LAYERS
    // =======================

    let heatLayer;

    const markerCluster = L.markerClusterGroup({
        showCoverageOnHover: false,
        maxClusterRadius: 40
    });

    updateHeatmapStyle();

    // =======================
    // AQI HELPERS
    // =======================

    // AQI → Color (for markers)
    function getAQIColor(aqi) {
        if (aqi <= 50) return "#00e400";
        if (aqi <= 100) return "#ffff00";
        if (aqi <= 150) return "#ff7e00";
        if (aqi <= 200) return "#ff0000";
        if (aqi <= 300) return "#8f3f97";
        return "#7e0023";
    }

    // AQI → Intensity (non-linear 🔥)
    function getIntensity(aqi) {
        let normalized = aqi / 300;
        let boosted = Math.pow(normalized, 2);

        let zoom = map.getZoom();

        // reduce intensity when zoomed in
        if (zoom > 8) {
            boosted *= 0.7;
        }

        return Math.max(0.1, Math.min(boosted, 1));
    }
    function updateHeatmapStyle() {
        const zoom = map.getZoom();

        let radius, blur;

        if (zoom <= 5) {
            radius = 50;
            blur = 40;
        } else if (zoom <= 7) {
            radius = 35;
            blur = 30;
        } else if (zoom <= 9) {
            radius = 25;
            blur = 20;
        } else {
            radius = 15;
            blur = 15;
        }

        if (heatLayer) {
            heatLayer.setOptions({
                radius: radius,
                blur: blur
            });
        }
    }

    // =======================
    // RENDER FUNCTION
    // =======================

    function renderMapData(aqiData) {

        // ===== HEATMAP =====
        const heatPoints = aqiData
            .filter(p => p.aqi && p.aqi > 0)
            .map(p => [
                p.lat,
                p.lon,
                getIntensity(p.aqi)
            ]);

        if (!heatLayer) {
            heatLayer = L.heatLayer(heatPoints, {
                radius: 50,
                blur: 45,
                maxZoom: 10,
                minOpacity: 0.15,

                // Smooth fade outward (center dark → edges transparent)
                gradient: {
                    0.2: "rgba(0,228,0,0.2)",
                    0.4: "rgba(255,255,0,0.3)",
                    0.6: "rgba(255,126,0,0.5)",
                    0.8: "rgba(255,0,0,0.7)",
                    1.0: "rgba(126,0,35,0.95)"
                }
            });
        } else {
            heatLayer.setLatLngs(heatPoints);
        }

        // ===== CLUSTERS =====
        markerCluster.clearLayers();

        aqiData.forEach(place => {
            if (!place.aqi || place.aqi <= 0) return;

            const marker = L.circleMarker([place.lat, place.lon], {
                radius: 6,
                fillColor: getAQIColor(place.aqi),
                color: "transparent",
                fillOpacity: 0.65
            });

            marker.bindPopup(`
                <div style="font-family: Arial; min-width: 200px;">
                    <b>${place.city}</b><br>
                    Station: ${place.station}<br>
                    AQI: <b>${place.aqi}</b>
                </div>
            `);

            markerCluster.addLayer(marker);
        });
    }

    // =======================
    // LAYER SWITCHING (HYBRID)
    // =======================

    function updateLayers() {
        const zoom = map.getZoom();

        if (zoom < 7) {
            // 🌫️ Heatmap view
            if (!map.hasLayer(heatLayer)) {
                map.addLayer(heatLayer);
            }
            if (map.hasLayer(markerCluster)) {
                map.removeLayer(markerCluster);
            }
        } else {
            // 📍 Cluster view
            if (!map.hasLayer(markerCluster)) {
                map.addLayer(markerCluster);
            }
            if (map.hasLayer(heatLayer)) {
                map.removeLayer(heatLayer);
            }
        }
    }

    map.on("zoomend", () => {
        updateLayers();
        updateHeatmapStyle();
    });

    // =======================
    // FETCH DATA FROM BACKEND
    // =======================

    async function loadAQIData(retries = 5) {
        try {
            const response = await fetch("http://localhost:8080/api/map");
            const data = await response.json();

            if (!data || data.length === 0) {
                if (retries > 0) {
                    console.log("No data yet, retrying...");
                    setTimeout(() => loadAQIData(retries - 1), 2000);
                    return;
                } else {
                    console.error("No AQI data available.");
                    return;
                }
            }

            console.log("AQI Data Loaded:", data);

            renderMapData(data);
            updateLayers();

        } catch (error) {
            console.error("Error fetching AQI data:", error);
        }
    }

    // =======================
    // INIT
    // =======================

    loadAQIData();
    // Fix Leaflet rendering issue
    setTimeout(() => {
        map.invalidateSize();
    }, 100);
</script>
<script src="map.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Air Quality Monitor</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/aqi.css">
</head>
<body>

<div class="register-wrapper">
    <div class="register-card">
        <div class="info-side">
            <div class="brand-badge">
                <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="18" fill="#2563eb" fill-opacity="0.15"/>
                    <path d="M20 8C13.4 8 8 13.4 8 20C8 26.6 13.4 32 20 32C26.6 32 32 26.6 32 20C32 13.4 26.6 8 20 8ZM20 28C15.6 28 12 24.4 12 20C12 15.6 15.6 12 20 12C24.4 12 28 15.6 28 20C28 24.4 24.4 28 20 28Z" fill="#2563eb"/>
                    <circle cx="20" cy="20" r="4" fill="#0284c7"/>
                </svg>
                <span>AQI Monitor</span>
            </div>
            <h2>Air Quality Insights & Monitoring</h2>
            <p class="subtitle">Track live pollution indices, receive health alerts, and explore station maps across cities.</p>

            <div class="aqi-scale-widget">
                <div class="scale-label">National AQI Index Scale</div>
                <div class="scale-bar">
                    <div class="g" title="Good (0-50)"></div>
                    <div class="m" title="Satisfactory (51-100)"></div>
                    <div class="u" title="Moderate (101-200)"></div>
                    <div class="un" title="Poor (201-300)"></div>
                    <div class="v" title="Very Poor (301-400)"></div>
                    <div class="h" title="Severe (401-500)"></div>
                </div>
                <div class="scale-legend">
                    <span>Good</span>
                    <span>Moderate</span>
                    <span>Severe</span>
                </div>
            </div>
        </div>

        <div class="form-side">
            <h1>Create Account</h1>
            <p class="form-subtitle">Fill in your credentials to register</p>

            <form method="post" action="/auth/register" id="registerForm">
                <div class="input-field">
                    <label for="regUsername">Username</label>
                    <input type="text" id="regUsername" name="regUsername" placeholder="Choose a username" required>
                </div>

                <div class="input-field">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" name="regEmail" placeholder="your.email@domain.com" required>
                </div>

                <div class="input-field">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" name="regPassword" placeholder="Minimum 6 characters" minlength="6" required>
                </div>

                <button type="submit" class="btn-submit">Register Account</button>
            </form>

            <div class="card-footer">
                Already have an account? <a href="/login" class="login-link">Sign In</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Air Quality Monitor</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="brand-header">
            <div class="brand-logo">
                <svg width="36" height="36" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <circle cx="20" cy="20" r="18" fill="#2563eb" fill-opacity="0.1"/>
                    <path d="M20 8C13.4 8 8 13.4 8 20C8 26.6 13.4 32 20 32C26.6 32 32 26.6 32 20C32 13.4 26.6 8 20 8ZM20 28C15.6 28 12 24.4 12 20C12 15.6 15.6 12 20 12C24.4 12 28 15.6 28 20C28 24.4 24.4 28 20 28Z" fill="#2563eb"/>
                    <circle cx="20" cy="20" r="4" fill="#0284c7"/>
                </svg>
            </div>
            <h2>Welcome Back</h2>
            <p class="brand-subtitle">Log in to view live air quality monitoring & station insights</p>
        </div>

        <form method="post" action="/login" class="auth-form">

            <div class="input-group">
                <label for="username">Email Address</label>
                <div class="input-field-wrapper">
                    <span class="field-icon">
                        <ion-icon name="mail-outline"></ion-icon>
                    </span>
                    <input type="email" id="username" name="username" placeholder="name@example.com" required autocomplete="email">
                </div>
            </div>

            <div class="input-group">
                <div class="label-row">
                    <label for="password">Password</label>
                    <a href="/forgot_password.html" class="forgot-link">Forgot password?</a>
                </div>
                <div class="input-field-wrapper">
                    <span class="field-icon">
                        <ion-icon name="lock-closed-outline"></ion-icon>
                    </span>
                    <input type="password" name="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                    <span class="password-toggle" onclick="togglePassword()">
                        <ion-icon name="eye-off-outline" id="toggleIcon"></ion-icon>
                    </span>
                </div>
            </div>

            <div id="loginError" class="login-error" style="display:none;">
                <ion-icon name="alert-circle-outline"></ion-icon>
                <span>Incorrect Username or Password</span>
            </div>

            <button type="submit" class="btn-primary">Sign In</button>

            <div class="auth-footer">
                <p>Don't have an account? <a href="/register" class="link-highlight">Register now</a></p>
            </div>

        </form>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    if (params.has("error")) {
        document.getElementById("loginError").style.display = "flex";
    }
</script>

<script src="/js/login.js"></script>
<script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

</body>
</html>

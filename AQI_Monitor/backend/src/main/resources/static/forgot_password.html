<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Air Quality Monitor</title>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/forgot_style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <div class="brand-badge">
            <svg width="28" height="28" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="20" cy="20" r="18" fill="#2563eb" fill-opacity="0.15"/>
                <path d="M20 8C13.4 8 8 13.4 8 20C8 26.6 13.4 32 20 32C26.6 32 32 26.6 32 20C32 13.4 26.6 8 20 8ZM20 28C15.6 28 12 24.4 12 20C12 15.6 15.6 12 20 12C24.4 12 28 15.6 28 20C28 24.4 24.4 28 20 28Z" fill="#2563eb"/>
                <circle cx="20" cy="20" r="4" fill="#0284c7"/>
            </svg>
            <span>AQI Monitor</span>
        </div>

        <h1>Reset Password</h1>
        <p class="subtitle">Enter your registered email address to receive password recovery instructions.</p>

        <form id="forgotForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="name@example.com" required>
                <div class="error" id="errorMsg">Please enter a valid email address</div>
            </div>

            <button type="submit" class="btn-submit">Send Reset Link</button>
            <div class="success" id="successMsg">Password reset email sent successfully. Please check your inbox.</div>
        </form>

        <div class="footer">
            Remembered your password? <a href="/login" class="login-link">Back to Login</a>
        </div>
    </div>
</div>

<script>
const form = document.getElementById('forgotForm');
const email = document.getElementById('email');
const error = document.getElementById('errorMsg');
const success = document.getElementById('successMsg');

form.addEventListener('submit', e => {
    e.preventDefault();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value);
    if (!valid) {
        error.style.display = 'block';
        return;
    }
    error.style.display = 'none';
    success.style.display = 'block';
    form.reset();
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQI Visualizer — Forgot Password</title>
<link rel="stylesheet" href="forgot_style.css">
</head>
<body>

<div class="container">
  <div class="card">
    <h1>Reset Password</h1>
    <p class="subtitle">Enter your registered email to receive reset link</p>

    <form id="forgotForm">
      <label>Email Address</label>
      <input type="email" id="email" required>
      <div class="error" id="errorMsg">Please enter a valid email</div>

      <button type="submit">Send Reset Link</button>
      <div class="success" id="successMsg">Reset link sent (demo)</div>
    </form>

    <div class="footer">
      Remembered your password?
      <a href="login.html" class="login-link">Back to Login</a>
    </div>
  </div>
</div>

<script>
const form=document.getElementById('forgotForm');
const email=document.getElementById('email');
const error=document.getElementById('errorMsg');
const success=document.getElementById('successMsg');

form.addEventListener('submit',e=>{
 e.preventDefault();
 const valid=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value);
 if(!valid){error.style.display='block';return}
 error.style.display='none';
 success.style.display='block';
 form.reset();
});
</script>

</body>
</html>

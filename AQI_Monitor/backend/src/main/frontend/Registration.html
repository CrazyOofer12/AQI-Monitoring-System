<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AQI Visualizer — Register</title>

<link rel="stylesheet" href="aqi.css">
</head>

<body>

<div class="container">

  <div class="info">
    <h1>Join AQI Visualizer</h1>
    <div class="subtitle">
      Track pollution levels, analyze trends & receive alerts for your city.
    </div>

    <div class="aqi-scale">
      <div>Air Quality Index Scale</div>
      <div class="bar">
        <div class="g"></div>
        <div class="m"></div>
        <div class="u"></div>
        <div class="un"></div>
        <div class="v"></div>
        <div class="h"></div>
      </div>
      <small>Good → Hazardous</small>
    </div>
  </div>

  <div class="form-area">
    <h1>Create Account</h1>

    <form method = "post" action="/auth/register" id="registerForm">
      <label>Username</label>
      <input type="text" id="username" required>
      <label>Email</label>
      <input type="email" id="email" required>
      <div class="error" id="emailError">Invalid email format</div>

      <label>Password</label>
      <input type="password" id="password" minlength="6" required>
      <button type="submit">Register</button>
      <div class="success" id="successMsg">Registration successful (demo only)</div>
    </form>

    <div class="footer">
      Already have an account?
      <a class="login-link" href="login.html">Login</a>
    </div>

  </div>
</div>

<script>
const form=document.getElementById('registerForm');
const email=document.getElementById('email');
const emailError=document.getElementById('emailError');
const success=document.getElementById('successMsg');

form.addEventListener('submit',e=>{
  e.preventDefault();

  const emailValid=/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(email.value);
  if(!emailValid){
    emailError.style.display='block';
    return;
  }
  emailError.style.display='none';

  const data={
    name:document.getElementById('name').value,
    email:email.value,
    password:document.getElementById('password').value,
    city:document.getElementById('city').value,
    alertLevel:document.getElementById('alert').value
  };

  console.log('Send to backend:',data);
  success.style.display='block';
  form.reset();
});
</script>

</body>
</html>

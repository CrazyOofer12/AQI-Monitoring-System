    <section>
    <div class="login-page">
        <form action="">
            <p class="Login-name">Login</p>
            <div class="input-box">

                <input type="email" name="username" required>

            </div>
            <div class="remember"></div>
            <label style="font-family: Ubuntu, sans-serif; color: beige;" ><input type="checkbox"> Remember me</label>
            <div class="forgetdiv">
                <a href="forgot_password.html" class="forget">  Forgot password?</a>
            </div>
            <div> <button type="Login">Login</button></div>
           <div class="register-link">
            <p style="font-family: Ubuntu, sans-serif;">Don't have an account? <a href="Registration.html" class="forget">Register now</a></p>
           </div>
    </div>
</section>
